name: release

on:
  push:
    tags:
      - 'cli-v*'
      - 'gui-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 完整历史与标签：生成发布清单要按"上一个标签..本次标签"取提交，
      # 浅克隆（默认 fetch-depth=1）会把区间算成空。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests (no desktop required)
        run: dotnet run -c Release --project tests/KeyMouse.Tests/KeyMouse.Tests.csproj

      - name: Publish (framework-dependent, needs the .NET runtime)
        run: dotnet publish src/KeyMouse.Cli/KeyMouse.Cli.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/fx --nologo

      - name: Publish (self-contained, needs nothing)
        run: dotnet publish src/KeyMouse.Cli/KeyMouse.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/self --nologo

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/fx/KeyMouse.exe   dist/KeyMouse-fx-x64.exe
          Copy-Item out/self/KeyMouse.exe dist/KeyMouse-x64.exe
          Get-ChildItem dist | Format-Table Name, Length

      # gui 标签发布的是编辑器（含安装程序）：它要自包含的 WinUI 运行时，
      # 构造过程和本地打包完全一致——同一个脚本，少一条"CI 与本地不一致"的岔路。
      - name: Pack the editor installer (gui-v* tag only)
        if: startsWith(github.ref, 'refs/tags/gui-')
        shell: pwsh
        run: ./tools/pack-release.ps1

      # 每次发布都带一份**精简清单**：由提交压成，作为 Release 正文（比 GitHub 自动笔记可读）。
      - name: Build release notes
        shell: pwsh
        run: ./tools/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Out release-notes.md

      - name: Show release notes
        shell: pwsh
        run: |
          Get-Content release-notes.md | Write-Host
          Write-Host ('清单大小: ' + (Get-Item release-notes.md).Length + ' 字节')

      # 两条发布各管各的：命令行标签只发两个 exe，gui 标签只发安装程序。
      - name: Attach the CLI binaries (cli-v* tag)
        if: startsWith(github.ref, 'refs/tags/cli-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KeyMouse-fx-x64.exe
            dist/KeyMouse-x64.exe
          body_path: release-notes.md

      - name: Attach the editor installer (gui-v* tag)
        if: startsWith(github.ref, 'refs/tags/gui-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeyMouseSetup-*.exe
          body_path: release-notes.md

      # 清单必须**在发布之后**写：发布之前 gh release edit 找不到 release，整步失败，
      # 而它一失败，后面的上传步骤就被跳过——结果是标签发了、资产一个没有（实测 v0.2.0 首推）。
      - name: Apply release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:GITHUB_REF_NAME --notes-file release-notes.md
