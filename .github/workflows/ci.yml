name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build KeyMouse.sln -c Release --nologo

      - name: Unit tests (no desktop required)
        run: dotnet run -c Release --project tests/KeyMouse.Tests/KeyMouse.Tests.csproj

      # tests/smoke.ps1 needs an interactive desktop (it drives Notepad), so it is
      # deliberately not part of CI - run it locally before a release.
      - name: Publish check (framework-dependent)
        run: dotnet publish KeyMouse.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/fx --nologo
